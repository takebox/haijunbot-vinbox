# ty configuration file
# Migrated from mypy.ini

[environment]
python-version = "3.12"
root = ["./src"]

[analysis]
# Ignore missing imports for third-party libraries
allowed-unresolved-imports = [
    "requests",
    "tabulate",
    "clang",
    "_jsonnet",
    "winpty",
    "pywinauto",
    "haijunbot.haijunbot_utils.http",
    "haijunbot.haijunbot_utils.quick_config",
    "haijunbot.haijunbot_tools.read_webpage",
    "haijunbot.haijunbot_tools.search_web",
    "haijunbot.haijunbot_tools.eli.main",
    "haijunbot.haijunbot_mcp.*",
]

# Replace imports with Any for modules without type stubs
replace-imports-with-any = [
    "requests",
    "tabulate",
    "clang",
    "_jsonnet",
    "winpty",
    "pywinauto",
    "haijunbot.haijunbot_utils.http",
    "haijunbot.haijunbot_utils.quick_config",
    "haijunbot.haijunbot_tools.read_webpage",
    "haijunbot.haijunbot_tools.search_web",
    "haijunbot.haijunbot_tools.eli.main",
]

[src]
exclude = [
    "**/.venv/",
    "**/venv/",
    "**/env/",
    "**/.tox/",
    "**/build/",
    "**/dist/",
    "**/.mypy_cache/",
    "**/site-packages/",
    "**/tests/",
    "**/test_cases/",
    "**/docs/",
    "**/scripts/",
    "**/builtin/",
]

[rules]
# Configure rule levels
# Note: ty has different rule names than mypy, these are approximations
possibly-unresolved-reference = "warn"
division-by-zero = "warn"
unresolved-import = "warn"

# Module-specific overrides
[[overrides]]
include = ["src/haijunbot/**"]
[overrides.rules]
# For project modules, be stricter
unresolved-import = "error"

[[overrides]]
include = ["src/haijunbot/haijunbot_mcp/**"]
[overrides.rules]
# MCP module uses third-party libraries - be more permissive
unresolved-import = "ignore"

