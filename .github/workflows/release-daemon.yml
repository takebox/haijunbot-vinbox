---
name: Release haijunbot-daemon

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: linux
            goarch: arm
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Build static binary
        working-directory: daemon
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          # CGO_ENABLED=0 ensures static linking, independent of target machine glibc version.
          # -trimpath removes local paths, -s -w strips symbol table and debug info.
          # On tag trigger, injects version into binary; on manual trigger, uses default.
          version="${{ github.ref_name }}"
          if [ -z "$version" ] || [ "${version#v}" = "$version" ]; then
            ldflags="-s -w"
          else
            ldflags="-s -w -X main.version=${version}"
          fi
          echo "Injecting version: ${version:-<default>}"
          go build -trimpath -ldflags="$ldflags" \
            -o "haijunbot-daemon${EXT}" ./cmd/haijunbot-daemon

      - name: Verify injected version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: daemon
        env:
          EXT: ${{ matrix.ext }}
        run: |
          if strings "haijunbot-daemon${EXT}" \
            | grep -qx "${{ github.ref_name }}"; then
            echo "Version injection confirmed: ${{ github.ref_name }}"
          else
            echo "Version not injected into binary"
            exit 1
          fi

      - name: Verify static linking
        if: matrix.goos == 'linux'
        working-directory: daemon
        env:
          EXT: ${{ matrix.ext }}
        run: |
          file "haijunbot-daemon${EXT}"
          if ldd "haijunbot-daemon${EXT}" 2>&1 \
            | grep -q "not a dynamic executable"; then
            echo "Static linking confirmed"
          else
            echo "Binary is not statically linked"
            ldd "haijunbot-daemon${EXT}" || true
            exit 1
          fi

      - name: Package artifact
        working-directory: daemon
        env:
          EXT: ${{ matrix.ext }}
        run: |
          name="haijunbot-daemon_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "${name}.zip" "haijunbot-daemon${EXT}"
            echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${name}.tar.gz" "haijunbot-daemon${EXT}"
            echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: haijunbot-daemon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: daemon/${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
